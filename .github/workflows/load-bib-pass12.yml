name: Load bibliography pass 12

on:
  push:
    paths:
      - 'LOAD_BIB_PASS12_TRIGGER.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add pass12 script include
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bibliography/index.html')
          s = p.read_text()
          old = '  <script src="bibliography-pass11.js?v=20260809-1" defer></script>\n  <script src="bibliography-tools.js?v=20260809-4" defer></script>'
          new = '  <script src="bibliography-pass11.js?v=20260809-1" defer></script>\n  <script src="bibliography-pass12.js?v=20260809-1" defer></script>\n  <script src="bibliography-tools.js?v=20260809-4" defer></script>'
          if new not in s:
              if old not in s:
                  raise SystemExit('loader marker missing')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibliography/index.html
          git commit -m "Load bibliography pass 12"
          git push

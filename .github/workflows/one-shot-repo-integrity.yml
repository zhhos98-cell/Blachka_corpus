name: One-shot repository integrity check

on:
  push:
    paths:
      - '.github/workflows/one-shot-repo-integrity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild People projection
        run: |
          python scripts/build-people-ui.py
          git diff --exit-code -- people/people-ui.json
      - name: Validate derived and public data
        run: python scripts/validate-derived-data.py
      - name: Verify active namespaces
        shell: bash
        run: |
          test ! -e sources/global-archive-register-supplement-2026-08-10.json
          test -e archive/data/global-archive-register-supplement-2026-08-10.json
          test -e archive/data/people-shards-2026-08-10/people-part-17.json
          test ! -e site-core.css
          test -e archive/ui/2026-08-11/site-core.css

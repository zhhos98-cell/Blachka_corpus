name: One-shot bibliography repair

on:
  push:
    paths:
      - '.github/workflows/one-shot-bibliography-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh bibliography first paint
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('bibliography/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('bibliography.css?v=20260809-3', 'bibliography.css?v=20260810-8')
          text = text.replace('bibliography-form.js?v=20260809-5', 'bibliography-form.js?v=20260810-8')
          text = text.replace('bibliography-tools.js?v=20260809-4', 'bibliography-tools.js?v=20260810-8')
          nav = '<nav class="subpage-nav" aria-label="Site navigation">\n      <a href="../cases/">Cases</a>\n      <a href="../people/">People</a>\n      <a href="./" aria-current="page">Bibliography</a>\n      <a href="../sources/">Sources</a>\n      <a href="../auctions/">Auctions</a>\n      <a href="../about/">About</a>\n    </nav>'
          text = re.sub(r'<nav class="subpage-nav" aria-label="Site navigation">.*?</nav>', nav, text, count=1, flags=re.S)
          footer = '<footer class="subpage-footer">\n    <div class="footer-identity"><a class="footer-title" href="../">The Blaschka Object Network</a><span class="footer-copyright">© 2026 Haohao Zhang. Site text and design unless otherwise credited. Source images and third-party materials retain their stated licences.</span></div>\n    <div class="footer-links"><a href="mailto:zhhos98@gmail.com?subject=Blaschka%20Object%20Network">Contact</a><a href="../rights/">Image rights</a><a href="../privacy/">Privacy</a><a href="../accessibility/">Accessibility</a><a class="footer-rss" href="../feed.xml">RSS</a></div>\n  </footer>'
          text = re.sub(r'<footer class="subpage-footer">.*?</footer>', footer, text, count=1, flags=re.S)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repaired bibliography shell
        run: |
          if git diff --quiet -- bibliography/index.html; then
            echo "No bibliography changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibliography/index.html
          git commit -m "Repair bibliography static shell"
          git push

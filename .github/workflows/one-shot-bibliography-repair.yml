name: One-shot bibliography repair

on:
  push:
    paths:
      - '.github/workflows/one-shot-bibliography-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh bibliography cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('bibliography/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('bibliography.css?v=20260809-3', 'bibliography.css?v=20260810-8')
          text = text.replace('bibliography-form.js?v=20260809-5', 'bibliography-form.js?v=20260810-8')
          text = text.replace('bibliography-tools.js?v=20260809-4', 'bibliography-tools.js?v=20260810-8')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repaired bibliography shell
        run: |
          if git diff --quiet -- bibliography/index.html; then
            echo "No bibliography changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibliography/index.html
          git commit -m "Refresh bibliography asset versions"
          git push

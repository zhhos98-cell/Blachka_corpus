name: One-shot unified runtime rollout

on:
  push:
    paths:
      - '.github/workflows/one-shot-unified-runtime-rollout.yml'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh active unified UI consumers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              'cases', 'sources', 'auctions', 'bibliography', 'people', 'map',
              'about', 'rights', 'privacy', 'accessibility', 'blog'
          ]
          for root in roots:
              base = Path(root)
              if not base.exists():
                  continue
              for path in list(base.rglob('*.html')) + list(base.rglob('*.js')):
                  if 'legacy' in path.parts or 'archive' in path.parts:
                      continue
                  text = path.read_text(encoding='utf-8')
                  updated = re.sub(r'unified-ui\.js\?v=[0-9-]+', 'unified-ui.js?v=20260811-5', text)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          bumps = {
              Path('cases/index.html'): {'cases-page.js': '20260811-3'},
              Path('sources/index.html'): {'sources-filter.js': '20260811-2'},
              Path('auctions/index.html'): {'auction-filter.js': '20260811-2'},
              Path('bibliography/index.html'): {
                  'bibliography-form.js': '20260811-2',
                  'bibliography-tools.js': '20260811-2',
              },
          }
          for path, tokens in bumps.items():
              text = path.read_text(encoding='utf-8')
              updated = text
              for name, version in tokens.items():
                  updated = re.sub(re.escape(name) + r'\?v=[0-9-]+', f'{name}?v={version}', updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
      - name: Verify protected research data untouched
        shell: bash
        run: |
          if ! git diff --quiet -- research/data; then
            echo "research/data changed unexpectedly"
            git diff -- research/data
            exit 1
          fi
      - name: Validate structured data
        run: python scripts/validate-derived-data.py
      - name: Commit rollout
        shell: bash
        run: |
          git add cases sources auctions bibliography people map about rights privacy accessibility blog
          if git diff --cached --quiet; then
            echo "Runtime consumers already current"
            exit 0
          fi
          git config user.name "Haohao Zhang"
          git config user.email "zhhos98@gmail.com"
          git commit -m "Roll out simplified unified UI runtime"
          git push origin HEAD:main

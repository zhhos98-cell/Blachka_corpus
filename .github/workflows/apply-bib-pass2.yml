name: Apply bibliography second expansion

on:
  push:
    paths:
      - 'BIB_PASS2_TRIGGER.txt'

permissions:
  contents: write

jobs:
  patch-bibliography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand chronological bibliography
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bibliography/index.html')
          s = p.read_text()
          if 'Walter Deane' in s and 'Mackenzie Jean Bullard' in s:
              raise SystemExit(0)

          s = s.replace('1897–2025 · first expanded pass', '1894–2025 · second expanded pass')
          s = s.replace(
              '<article class="bib-entry"><p class="bib-year">1897</p><div><h3>Marcia E. Hale',
              '''<article class="bib-entry"><p class="bib-year">1894</p><div><h3>Walter Deane, “The Ware Collection of Blaschka Glass Models of Flowers at Harvard,” <em>Botanical Gazette</em> 19(4): 144–148.</h3><p class="bib-links"><a href="https://www.biodiversitylibrary.org/part/222353" target="_blank" rel="noopener">Biodiversity Heritage Library ↗</a> · <a href="https://doi.org/10.1086/327034" target="_blank" rel="noopener">DOI ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">1897</p><div><h3>Marcia E. Hale''')

          s = s.replace(
              '<article class="bib-entry"><p class="bib-year">2003</p><div><h3>Susan M. Rossi-Wilcox',
              '''<article class="bib-entry"><p class="bib-year">2002</p><div><h3>Rupal Christine Pinto, <em>Making Harvard’s Glass Flowers: The Interface of Botany, Gender, and Artistic Virtuosity in America</em>. Honors thesis, Department of the History of Science, Harvard University.</h3><p class="bib-links"><a href="https://citeseerx.ist.psu.edu/document?doi=38b3ea5123c44a122defdd256f717b3bff644d45&amp;repid=rep1&amp;type=pdf" target="_blank" rel="noopener">Thesis PDF record ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2003</p><div><h3>Susan M. Rossi-Wilcox''')

          s = s.replace(
              '<article class="bib-entry"><p class="bib-year">2005</p><div><h3>Henri Reiling',
              '''<article class="bib-entry"><p class="bib-year">2003</p><div><h3>N. T. Monaghan, “Modelling Nature,” <em>Irish Arts Review</em>, Winter 2003: 120–123.</h3><p class="bib-links"><a href="https://www.museum.ie/en-IE/Collections-Research/Natural-History-Collections/Collections-List/Blaschka-Glass" target="_blank" rel="noopener">National Museum of Ireland bibliography ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2003</p><div><h3>D. Walshe and N. T. Monaghan, “The Collection of Blaschka Glass Models in the Natural History Museum, Dublin,” <em>Museum Ireland</em> 13: 43–48.</h3><p class="bib-links"><a href="https://www.museum.ie/en-IE/Collections-Research/Natural-History-Collections/Collections-List/Blaschka-Glass" target="_blank" rel="noopener">National Museum of Ireland bibliography ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2004</p><div><h3>Lorraine Daston, “The Glass Flowers,” in Lorraine Daston, ed., <em>Things That Talk: Object Lessons from Art and Science</em>, 223–254. New York: Zone Books.</h3><p class="bib-links"><a href="https://www.mpg.de/14613479/publications?page=5&amp;year=2004" target="_blank" rel="noopener">Max Planck publication record ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2005</p><div><h3>Henri Reiling''')

          s = s.replace(
              '<article class="bib-entry"><p class="bib-year">2007</p><div><h3>Susan M. Rossi-Wilcox',
              '''<article class="bib-entry"><p class="bib-year">2006</p><div><h3>N. T. Monaghan, J. D. Sigwart, and C. A. McGuinness, <em>Blaschka Glass Models</em>. Dublin: National Museum of Ireland.</h3><p class="bib-links"><a href="https://www.museum.ie/en-IE/Collections-Research/Natural-History-Collections/Collections-List/Blaschka-Glass" target="_blank" rel="noopener">National Museum of Ireland ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2007</p><div><h3>Susan M. Rossi-Wilcox''')

          s = s.replace(
              '<article class="bib-entry"><p class="bib-year">2009</p><div><h3>Liesa Brierley',
              '''<article class="bib-entry"><p class="bib-year">2008</p><div><h3>Liesa Brierley, <em>Examination and Conservation of Two Blaschka Glass Models of Micro-Organisms</em>. Diplomarbeit, FH Erfurt.</h3><p class="bib-links"><a href="https://www.hornemann-institut.de/en/epubl_ha_ausgabe.php?ha_sort=aj&amp;haid=2799&amp;l=o&amp;sort=ha_abgabedatum+DESC%2C+ea_name%2C+ea_vorname&amp;spra=deutsch&amp;th=2005" target="_blank" rel="noopener">Hornemann Institute thesis record ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2009</p><div><h3>Liesa Brierley''')

          s = s.replace(
              '<article class="bib-entry"><p class="bib-year">2012</p><div><h3>N. Astrid R. van Giffen',
              '''<article class="bib-entry"><p class="bib-year">2010</p><div><h3>Sabine Hackethal, “Kunstwerke für die Wissenschaft – Glasmodelle wirbelloser Tiere aus dem Atelier von Leopold und Rudolf Blaschka,” in Ferdinand Damaschun, Sabine Hackethal, Hannelore Landsberg, and Reinhold Leinfelder, eds., <em>Klasse, Ordnung, Art: 200 Jahre Museum für Naturkunde</em>, 166–169. Rangsdorf: Basilisken-Presse.</h3><p class="bib-links"><a href="https://www.museumfuernaturkunde.berlin/sites/default/files/sh_publikationen_ab_2010.pdf" target="_blank" rel="noopener">Museum für Naturkunde publication list ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2011</p><div><h3>Ellery E. Foutch, <em>Arresting Beauty: The Perfectionist Impulse of Peale’s Butterflies, Heade’s Hummingbirds, Blaschka’s Flowers, and Sandow’s Body</em>. PhD dissertation, History of Art, University of Pennsylvania.</h3><p class="bib-links"><a href="https://arth.sas.upenn.edu/node/152" target="_blank" rel="noopener">Penn dissertation list ↗</a> · <a href="https://americanart.si.edu/research/fellowships/fellows/ellery-foutch" target="_blank" rel="noopener">Smithsonian project record ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2011</p><div><h3>Vladimír Dufek and Milan Gelnar, “Sklarsky rod Blaschku – Nastin Genealogie,” <em>Heraldika a genealogie</em>, issue 1–2/2010.</h3><p class="bib-links"><a href="https://hollisarchives.lib.harvard.edu/catalog/ecb00006" target="_blank" rel="noopener">HOLLIS citation ↗</a> · <a href="http://www.heraldica.cz/ghmags/2010/ghmag_2010_1-2_article-6.pdf" target="_blank" rel="noopener">PDF cited by HOLLIS ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2012</p><div><h3>Ina Scheunemann, <em>Glasmodelle der Blaschka-Sammlung des Museums für Naturkunde Berlin – Grenzen und Möglichkeiten der konservatorischen Bearbeitung</em>. Masterarbeit, Hochschule für Technik und Wirtschaft Berlin.</h3><p class="bib-links"><a href="https://hornemann-institut.de/en/epubl_ha_ausgabe.php?ha_sort=hs&amp;haid=3421&amp;l=o&amp;sort=ea_name&amp;spra=deutsch&amp;th=7" target="_blank" rel="noopener">Hornemann Institute thesis record ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2012</p><div><h3>Sonia Wanson, Isabelle Pirotte, and Jacques Ninane, <em>Blaschka: maîtres et modèles. La collection Blaschka des modèles en verre d’animaux marins du Muséum de l’Université de Liège</em>. Liège: Presses Universitaires de Liège.</h3><p class="bib-links"><a href="https://www.musees.uliege.be/cms/c_12317017/en/blaschka-masters-and-models" target="_blank" rel="noopener">Université de Liège catalogue record ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2012</p><div><h3>N. Astrid R. van Giffen''')

          s = s.replace(
              '<article class="bib-entry"><p class="bib-year">2017</p><div><h3>Alexandra Ruggiero',
              '''<article class="bib-entry"><p class="bib-year">2016</p><div><h3>Lorna Barnes, “The Conservation of a Collection of Blashka Glass Models from the Natural History Museum, Dublin,” in R. Miles, ed., <em>Conservation Activities in Ireland III and IV</em>, 69–72. Dublin: Wordwell.</h3><p class="bib-links"><a href="https://www.museum.ie/en-IE/Collections-Research/Natural-History-Collections/Collections-List/Blaschka-Glass" target="_blank" rel="noopener">National Museum of Ireland bibliography ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2017</p><div><h3>Alexandra Ruggiero''')

          s = s.replace(
              '<article class="bib-entry"><p class="bib-year">2019</p><div><h3>N. Astrid R. van Giffen',
              '''<article class="bib-entry"><p class="bib-year">2017</p><div><h3>Laura Faustini and Stefania Lotti, “La collezione Blaschka del Museo della Fondazione Scienza e Tecnica di Firenze,” <em>Museologia Scientifica Memorie</em> 17: 39–42.</h3><p class="bib-links"><a href="https://www.anms.it/riviste/dettaglio_rivista/31/ottobre_2017_-_n._17" target="_blank" rel="noopener">ANMS record ↗</a> · <a href="https://www.anms.it/upload/rivistefiles/ea68514c1e9c7c51af4364f7ab8fb2a2.pdf" target="_blank" rel="noopener">Open PDF ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2017</p><div><h3>Dante Abate, Sorin Hermon, Stefania Lotti, and Gianna Innocenti, “3D Scientific Visualisation of 19th Century Glass Replicas of Invertebrates,” in <em>2017 IEEE 13th International Conference on eScience</em>, 533–541.</h3><p class="bib-links"><a href="https://doi.org/10.1109/eScience.2017.87" target="_blank" rel="noopener">DOI ↗</a> · <a href="https://flore.unifi.it/handle/2158/1130940" target="_blank" rel="noopener">University of Florence record ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2017</p><div><h3>N. Astrid R. van Giffen, “The Case of the Hydrating Hydra: Examination and Treatment of a Blaschka Glass Invertebrate Model,” <em>Objects Specialty Group Postprints</em> 24: 351–371.</h3><p class="bib-links"><a href="https://resources.culturalheritage.org/osg-postprints/wp-content/uploads/sites/8/2019/12/osg024-019.pdf" target="_blank" rel="noopener">Open postprint ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2019</p><div><h3>N. Astrid R. van Giffen''')

          s = s.replace(
              '<article class="bib-entry"><p class="bib-year">2025</p><div><h3>Gemma Giani',
              '''<article class="bib-entry"><p class="bib-year">2020</p><div><h3>Donald H. Pfister and Jennifer Brown, “Inspired by Plants: The Glass Flowers as a Window into Botanical Education,” <em>Journal of Antiques &amp; Collectibles</em>.</h3><p class="bib-links"><a href="https://pfistergroup.oeb.harvard.edu/publications/inspired-plants-glass-flowers-window-botanical-education" target="_blank" rel="noopener">Harvard publication record ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2022</p><div><h3>Jacquelyn Dale Whitman, Paolo Viscardi, and Emmanuel G. Reynaud, “Recording of Blaschka Glass Invertebrate Models: A Method and Workflow for Imaging Using Standardized Methods,” <em>Journal of Natural Science Collections</em> 10: 115–145.</h3><p class="bib-links"><a href="https://www.natsca.org/node/2731" target="_blank" rel="noopener">NatSCA article ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2024</p><div><h3>Mackenzie Bullard and M. Elen Deming, “Popular Reception for Harvard’s Glass Flowers: The ‘Afterlife’ of a Scientific Garden,” <em>Landscape Research Record</em> 13: 108–119.</h3><p class="bib-links"><a href="https://thecela.org/wp-content/uploads/LRR_13_POPULAR-RECEPTION-FOR-HARVARDS-GLASS-FLOWERS.pdf" target="_blank" rel="noopener">Open conference paper ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2025</p><div><h3>Mackenzie Jean Bullard, <em>Harvard’s Garden in the Museum: The Ware Collection of Blaschka Glass Flowers</em>. PhD dissertation, Design, North Carolina State University.</h3><p class="bib-links"><a href="https://repository.lib.ncsu.edu/items/14b1b81d-9de0-499c-803e-fff915b7fd53" target="_blank" rel="noopener">NCSU repository ↗</a></p></div></article>\n        <article class="bib-entry"><p class="bib-year">2025</p><div><h3>Gemma Giani''')

          s = s.replace(
              'The next passes will continue catalogue-by-catalogue and citation-by-citation, including German-language publications, exhibition catalogues, institutional collection studies, theses, conservation literature, and references recovered from the HOLLIS publication files.',
              'The next passes will continue catalogue-by-catalogue and citation-by-citation. HOLLIS Series VIII, “Publications Referencing Leopold and Rudolf Blaschka and Glass Flower Exhibit,” is being used as a discovery backbone alongside German and union-library catalogues, theses, exhibition catalogues, conservation literature, and forward/backward citation chaining.'
          )
          p.write_text(s)
          PY
      - name: Commit bibliography expansion
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibliography/index.html
          git commit -m "Expand bibliography with archival and catalogue pass"
          git push

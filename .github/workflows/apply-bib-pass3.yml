name: Apply bibliography third expansion

on:
  push:
    paths:
      - BIB_PASS3_TRIGGER.txt

permissions:
  contents: write

jobs:
  patch-bibliography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bibliography patch
        run: python scripts/bib_pass3.py
      - name: Commit bibliography patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibliography/index.html
          git commit -m "Expand bibliography with early reception and rediscovery literature"
          git push

name: Apply case batch page patch

on:
  push:
    paths:
      - 'CASE_BATCH_TRIGGER.txt'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add case batch scripts to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '''  <script src="motion.js?v=20260809-4" defer></script>\n  <script src="maps-v3.js?v=20260809-1" defer></script>\n  <script src="visuals-v1.js?v=20260809-1" defer></script>'''
          new = '''  <script src="cases-v2.js?v=20260809-1" defer></script>\n  <script src="motion.js?v=20260809-5" defer></script>\n  <script src="case-index-v2.js?v=20260809-1" defer></script>\n  <script src="maps-v3.js?v=20260809-2" defer></script>\n  <script src="maps-v4.js?v=20260809-1" defer></script>\n  <script src="visuals-v1.js?v=20260809-2" defer></script>\n  <script src="visuals-v2.js?v=20260809-1" defer></script>'''
          if old not in text:
              if 'cases-v2.js' in text:
                  print('Homepage already patched.')
                  raise SystemExit(0)
              raise SystemExit('Expected script block not found; refusing broad rewrite.')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit homepage patch
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load second batch of five public cases'
          git push

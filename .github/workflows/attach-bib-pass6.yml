name: Attach bibliography pass 6

on:
  push:
    paths:
      - 'BIB_PASS6_TRIGGER.txt'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bibliography loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bibliography/bibliography-form.js')
          s = p.read_text()
          marker = "data-bib-pass6-loader"
          if marker not in s:
              pos = s.rfind('})();')
              if pos == -1:
                  raise SystemExit('runtime closure not found')
              loader = "\n  if (!document.querySelector('script[data-bib-pass6-loader]')) {\n    const pass6 = document.createElement('script');\n    pass6.src = 'bibliography-pass6.js?v=20260809-1';\n    pass6.dataset.bibPass6Loader = 'true';\n    document.head.appendChild(pass6);\n  }\n"
              p.write_text(s[:pos] + loader + s[pos:])
          PY
      - name: Commit loader
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibliography/bibliography-form.js
          git commit -m "Load sixth bibliography expansion"
          git push

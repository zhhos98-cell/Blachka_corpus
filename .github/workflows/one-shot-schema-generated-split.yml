name: One-shot schema generated split

on:
  push:
    paths:
      - '.github/workflows/one-shot-schema-generated-split.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Separate generated inventories
        shell: bash
        run: |
          mkdir -p schemas/generated
          git mv schemas/schema-family-profile.json schemas/generated/schema-family-profile.json
          git mv schemas/status-vocabulary-inventory.json schemas/generated/status-vocabulary-inventory.json
          cat > schemas/generated/README.md <<'EOF'
          # Generated structural inventories

          Files in this directory are deterministic audit outputs. Do not hand-edit them or treat them as evidence-bearing research records.

          - `schema-family-profile.json` is generated by `scripts/audit-json-schema-families.py`.
          - `status-vocabulary-inventory.json` is generated by `scripts/audit-status-vocabularies.py`.

          The authoritative historical claims remain in the Source/Auction registers and other canonical research files. Re-run the generating script when the public JSON structure changes.
          EOF
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'scripts/audit-json-schema-families.py': [
                  ('PROFILE_OUT = SCHEMAS / "schema-family-profile.json"', 'PROFILE_OUT = SCHEMAS / "generated" / "schema-family-profile.json"'),
                  ('SCHEMAS.mkdir(exist_ok=True)', 'PROFILE_OUT.parent.mkdir(parents=True, exist_ok=True)'),
                  ('../schemas/schema-family-profile.json', '../schemas/generated/schema-family-profile.json'),
              ],
              'scripts/audit-status-vocabularies.py': [
                  ('JSON_OUT = SCHEMAS / "status-vocabulary-inventory.json"', 'JSON_OUT = SCHEMAS / "generated" / "status-vocabulary-inventory.json"'),
                  ('SCHEMAS.mkdir(exist_ok=True)', 'JSON_OUT.parent.mkdir(parents=True, exist_ok=True)'),
                  ('../schemas/status-vocabulary-inventory.json', '../schemas/generated/status-vocabulary-inventory.json'),
              ],
              'docs/schema-family-audit-2026-08-11.md': [
                  ('../schemas/schema-family-profile.json', '../schemas/generated/schema-family-profile.json'),
              ],
              'docs/status-vocabulary-audit-2026-08-11.md': [
                  ('../schemas/status-vocabulary-inventory.json', '../schemas/generated/status-vocabulary-inventory.json'),
              ],
              'schemas/README.md': [
                  ('`schema-family-profile.json` is a generated descriptive audit', '`generated/schema-family-profile.json` is a generated descriptive audit'),
                  ('Vocabulary files may be added here', 'Generated inventories live under `generated/`. Vocabulary files may be added here'),
              ],
              'scripts/README.md': [
                  ('into `schemas/schema-family-profile.json` plus a dated audit note', 'into `schemas/generated/schema-family-profile.json` plus a dated audit note'),
              ],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing replacement token in {name}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify protected data untouched
        run: git diff --quiet -- research/data people/people-data.json sources auctions
      - name: Validate current structure
        run: python scripts/validate-derived-data.py
      - name: Commit generated/schema split
        shell: bash
        run: |
          git add schemas scripts docs
          git config user.name "Haohao Zhang"
          git config user.email "zhhos98@gmail.com"
          git commit -m "Separate generated schema inventories"
          git push origin HEAD:main

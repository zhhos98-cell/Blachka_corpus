name: Patch Sources and bibliography tools

on:
  push:
    paths:
      - 'PATCH_SOURCES_BIB_TOOLS_TRIGGER.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation and bibliography script loading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              if not p.exists(): return
              s = p.read_text()
              if new in s: return
              if old not in s:
                  print(f'pattern not found in {path}: {old!r}')
                  return
              p.write_text(s.replace(old, new, 1))

          # Main-page static and runtime navigation.
          replace_once('index.html',
              '        <a href="bibliography/">Bibliography</a>\n        <a href="auctions/">Auctions</a>',
              '        <a href="bibliography/">Bibliography</a>\n        <a href="sources/">Sources</a>\n        <a href="auctions/">Auctions</a>')
          replace_once('motion.js',
              '      <a href="bibliography/">Bibliography</a>\n      <a href="auctions/">Auctions</a>',
              '      <a href="bibliography/">Bibliography</a>\n      <a href="sources/">Sources</a>\n      <a href="auctions/">Auctions</a>')

          # Bibliography uses a self-link rather than ../bibliography/.
          replace_once('bibliography/index.html',
              '      <a href="./" aria-current="page">Bibliography</a>\n      <a href="../auctions/">Auctions</a>',
              '      <a href="./" aria-current="page">Bibliography</a>\n      <a href="../sources/">Sources</a>\n      <a href="../auctions/">Auctions</a>')

          # Other secondary pages.
          for path in ['auctions/index.html', 'blog/index.html', 'privacy/index.html']:
              p = Path(path)
              if not p.exists(): continue
              s = p.read_text()
              source_line = '      <a href="../sources/">Sources</a>'
              if source_line not in s and '      <a href="../bibliography/">Bibliography</a>' in s:
                  s = s.replace('      <a href="../bibliography/">Bibliography</a>',
                                '      <a href="../bibliography/">Bibliography</a>\n' + source_line, 1)
                  p.write_text(s)

          # Ensure direct, cache-busted loading of every bibliography pass and the tools.
          p = Path('bibliography/index.html')
          s = p.read_text()
          if 'bibliography-pass10.js?v=20260809-1' not in s:
              marker = '  <script src="bibliography-tools.js?v=20260809-3" defer></script>'
              if marker not in s:
                  raise SystemExit('bibliography tools marker missing')
              s = s.replace(marker,
                    '  <script src="bibliography-pass10.js?v=20260809-1" defer></script>\n' + marker, 1)
              p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html motion.js bibliography/index.html auctions/index.html blog/index.html privacy/index.html 2>/dev/null || true
          git commit -m "Finish Sources navigation and bibliography loading"
          git push

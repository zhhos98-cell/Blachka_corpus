name: Patch Sources and bibliography tools

on:
  push:
    paths:
      - 'PATCH_SOURCES_BIB_TOOLS_TRIGGER.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation and bibliography script loading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_if(path, old, new):
              p = Path(path)
              if not p.exists():
                  return
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  print(f'pattern not found in {path}: {old!r}')
                  return
              p.write_text(s.replace(old, new, 1))

          # Root static navigation.
          replace_if(
              'index.html',
              '        <a href="bibliography/">Bibliography</a>\n        <a href="auctions/">Auctions</a>',
              '        <a href="bibliography/">Bibliography</a>\n        <a href="sources/">Sources</a>\n        <a href="auctions/">Auctions</a>'
          )

          # Runtime navigation written by motion.js.
          replace_if(
              'motion.js',
              '      <a href="bibliography/">Bibliography</a>\n      <a href="auctions/">Auctions</a>',
              '      <a href="bibliography/">Bibliography</a>\n      <a href="sources/">Sources</a>\n      <a href="auctions/">Auctions</a>'
          )

          # Secondary-page navigation.
          for path in ['bibliography/index.html', 'auctions/index.html', 'blog/index.html', 'privacy/index.html']:
              replace_if(
                  path,
                  '      <a href="../bibliography/">Bibliography</a>\n      <a href="../auctions/">Auctions</a>',
                  '      <a href="../bibliography/">Bibliography</a>\n      <a href="../sources/">Sources</a>\n      <a href="../auctions/">Auctions</a>'
              )

          # Load every bibliography layer directly and cache-bust it. This avoids a stale
          # multi-hop dynamic-loader chain hiding the sort/export controls in browsers.
          p = Path('bibliography/index.html')
          s = p.read_text()
          old = '  <script src="bibliography-form.js?v=20260809-1" defer></script>'
          stack = '''  <script src="bibliography-form.js?v=20260809-5" defer></script>\n  <script src="bibliography-pass6.js?v=20260809-2" defer></script>\n  <script src="bibliography-pass7.js?v=20260809-3" defer></script>\n  <script src="bibliography-pass8.js?v=20260809-2" defer></script>\n  <script src="bibliography-pass9.js?v=20260809-1" defer></script>\n  <script src="bibliography-tools.js?v=20260809-3" defer></script>'''
          if 'bibliography-tools.js?v=20260809-3' not in s:
              if old not in s:
                  raise SystemExit('bibliography script include not found')
              s = s.replace(old, stack, 1)
              p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html motion.js bibliography/index.html auctions/index.html blog/index.html privacy/index.html 2>/dev/null || true
          git commit -m "Expose Sources and bibliography tools"
          git push

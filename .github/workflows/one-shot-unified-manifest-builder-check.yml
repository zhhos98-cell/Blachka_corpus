name: One-shot unified manifest builder check

on:
  push:
    paths:
      - '.github/workflows/one-shot-unified-manifest-builder-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild both structural manifests
        run: python scripts/build-structural-manifests.py
      - name: Require byte-identical manifests
        run: git diff --exit-code -- sources/register-manifest.json auctions/data-manifest.json
      - name: Validate derived structure and envelopes
        run: python scripts/validate-derived-data.py

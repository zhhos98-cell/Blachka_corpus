name: One-shot performance bundles

on:
  push:
    paths:
      - '.github/workflows/one-shot-performance-bundles.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lean CSS and JS bundles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # One variable Roman Garamond is enough for the public UI. Allow the
          # browser to synthesize italics instead of downloading a second ~700 KB font.
          for name in ['typography-garamond.css', 'site-polish.css']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = re.sub(r"@font-face\{\s*font-family:'EB Garamond Local';\s*src:url\('assets/fonts/EBGaramond-Italic-VariableFont_wght\.ttf'\) format\('truetype'\);\s*font-style:italic;\s*font-weight:400 800;\s*font-display:swap;\s*\}\s*", '', text, count=1, flags=re.S)
              text = text.replace('html{font-synthesis:none}\n', '')
              p.write_text(text, encoding='utf-8')

          def bundle(out, files, banner):
              parts = [f'/* {banner} · generated 2026-08-10 */\n']
              for filename in files:
                  data = Path(filename).read_text(encoding='utf-8').strip()
                  parts.append(f'\n/* ---- {filename} ---- */\n{data}\n')
              Path(out).write_text(''.join(parts), encoding='utf-8')

          bundle('site-core.css', [
              'apple-unified.css',
              'subpage-v2.css',
              'fluid-motion.css',
              'site-rhythm.css',
              'site-polish.css',
              'header-minimal.css',
              'footer-legal.css',
              'nav-glide.css',
              'mobile-v3.css',
              'mobile-fixes.css',
              'accessibility.css',
              'scale-balance.css',
              'navigation-shell.css',
          ], 'Consolidated secondary-page UI layer')

          bundle('home-core.css', [
              'site-polish.css',
              'home-curation-v2.css',
              'origin-divider.css',
              'home-nav-glide.css',
              'mobile-v3.css',
              'accessibility.css',
              'scale-balance.css',
          ], 'Consolidated homepage enhancement layer')

          bundle('sources/sources-runtime.js', [
              *[f'sources/sources-pass{i}.js' for i in range(2, 13)],
              'sources/sources-az.js',
          ], 'Consolidated Sources runtime')

          bundle('cases-visuals-bundle.js', [
              'maps-v3.js',
              'maps-v4.js',
              'map-ratio-fix.js',
              'visuals-v1.js',
              'visuals-v2.js',
          ], 'Deferred Cases visual enhancement bundle')
          PY
      - name: Commit generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typography-garamond.css site-polish.css site-core.css home-core.css sources/sources-runtime.js cases-visuals-bundle.js
          git commit -m "Generate lean site performance bundles"
          git push

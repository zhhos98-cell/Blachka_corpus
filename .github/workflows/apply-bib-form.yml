name: Apply bibliography form loader

on:
  push:
    paths:
      - 'BIB_FORM_TRIGGER.txt'

permissions:
  contents: write

jobs:
  patch-bibliography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load bibliography form placeholder
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bibliography/index.html')
          s = p.read_text()
          tag = '  <script src="bibliography-form.js?v=20260809-1" defer></script>\n'
          if 'bibliography-form.js' not in s:
              s = s.replace('</body>', tag + '</body>')
              p.write_text(s)
          PY
      - name: Commit bibliography patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibliography/index.html
          git commit -m "Load bibliography contribution placeholder"
          git push

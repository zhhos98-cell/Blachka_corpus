name: One-shot source reuse UI validation

on:
  push:
    paths:
      - '.github/workflows/one-shot-source-reuse-ui.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild projection and verify no drift
        shell: bash
        run: |
          cp sources/source-reuse-ui.json /tmp/source-reuse-ui.json
          python scripts/build-source-reuse-ui.py
          diff -u /tmp/source-reuse-ui.json sources/source-reuse-ui.json
      - name: Check frontend and derived-data integrity
        shell: bash
        run: |
          node --check sources/sources-filter.js
          python scripts/validate-derived-data.py

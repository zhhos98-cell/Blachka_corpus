name: One-shot Auction canonical sync audit

on:
  push:
    paths:
      - '.github/workflows/one-shot-auction-canonical-sync-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot protected data
        shell: bash
        run: |
          sha256sum people/people-data.json > /tmp/protected.sha
          find research/data -type f -print0 | sort -z | xargs -0 sha256sum >> /tmp/protected.sha
          find sources -maxdepth 1 -type f -name '*-register.json' -print0 | sort -z | xargs -0 sha256sum >> /tmp/protected.sha
          find auctions -maxdepth 1 -type f -name '*.json' ! -name 'data-manifest.json' -print0 | sort -z | xargs -0 sha256sum >> /tmp/protected.sha
      - name: Run Auction canonical sync audit
        run: python scripts/audit-auction-canonical-sync.py
      - name: Verify protected data unchanged
        shell: bash
        run: |
          sha256sum people/people-data.json > /tmp/protected-after.sha
          find research/data -type f -print0 | sort -z | xargs -0 sha256sum >> /tmp/protected-after.sha
          find sources -maxdepth 1 -type f -name '*-register.json' -print0 | sort -z | xargs -0 sha256sum >> /tmp/protected-after.sha
          find auctions -maxdepth 1 -type f -name '*.json' ! -name 'data-manifest.json' -print0 | sort -z | xargs -0 sha256sum >> /tmp/protected-after.sha
          diff -u /tmp/protected.sha /tmp/protected-after.sha
      - name: Validate structured data
        run: python scripts/validate-derived-data.py
      - name: Commit audit outputs
        shell: bash
        run: |
          git add schemas/generated/auction-canonical-sync-audit.json docs/auction-canonical-sync-audit-2026-08-11.md
          if git diff --cached --quiet; then
            echo "Auction sync audit outputs already current"
            exit 0
          fi
          git config user.name "Haohao Zhang"
          git config user.email "zhhos98@gmail.com"
          git commit -m "Record Auction canonical-sync audit"
          git pull --rebase origin main
          git push origin HEAD:main

name: One-shot performance cache rollout

on:
  push:
    paths:
      - '.github/workflows/one-shot-performance-cleanup.yml'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh active font and bundle cache keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  if required:
                      raise SystemExit(f'Expected token not found in {path}: {old}')
                  return False
              p.write_text(s.replace(old, new), encoding='utf-8')
              return True

          # Direct page-family imports of the newly subsetted font.
          for path in ('people/people.css', 'map/map.css', 'bibliography/bibliography.css'):
              replace(path, 'typography-garamond.css?v=20260810-4', 'typography-garamond.css?v=20260811-1')

          # The legacy secondary bundle is still used by a few small reading pages.
          replace('site-core.css', 'typography-garamond.css?v=20260810-1', 'typography-garamond.css?v=20260811-1')

          # Make browsers request the changed parent CSS immediately.
          replacements = {
              'people/index.html': [('people.css?v=20260810-3','people.css?v=20260811-1')],
              'map/index.html': [('map.css?v=20260810-3','map.css?v=20260811-1')],
              'bibliography/index.html': [('bibliography.css?v=20260810-8','bibliography.css?v=20260811-1')],
              'index.html': [('home-v2.css?v=20260810-4','home-v2.css?v=20260811-1')],
          }
          for path, pairs in replacements.items():
              for old, new in pairs:
                  replace(path, old, new)

          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              n = s.replace('site-core.css?v=20260810-1', 'site-core.css?v=20260811-2')
              if n != s:
                  p.write_text(n, encoding='utf-8')
          PY

      - name: Verify rollout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          assert 'home-v2.css?v=20260811-1' in Path('index.html').read_text(encoding='utf-8')
          assert 'typography-garamond.css?v=20260811-1' in Path('people/people.css').read_text(encoding='utf-8')
          assert 'typography-garamond.css?v=20260811-1' in Path('map/map.css').read_text(encoding='utf-8')
          assert 'typography-garamond.css?v=20260811-1' in Path('bibliography/bibliography.css').read_text(encoding='utf-8')
          assert 'typography-garamond.css?v=20260811-1' in Path('site-core.css').read_text(encoding='utf-8')
          print('cache rollout verified')
          PY

      - name: Commit rollout
        shell: bash
        run: |
          git config user.name 'Haohao Zhang'
          git config user.email 'zhhos98@gmail.com'
          git add -A
          git commit -m 'Refresh active performance cache keys'
          git push

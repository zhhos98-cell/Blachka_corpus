name: One-shot Sources staticization

on:
  push:
    paths:
      - '.github/workflows/one-shot-staticize-sources.yml'

permissions:
  contents: write

jobs:
  staticize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install DOM serializer
        run: npm install jsdom@24 --no-save --no-package-lock
      - name: Render Sources once
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { JSDOM } = require('jsdom');
          const sourceDir = path.join(process.cwd(), 'sources');
          const indexPath = path.join(sourceDir, 'index.html');
          const runtimePath = path.join(sourceDir, 'sources-runtime.js');
          const html = fs.readFileSync(indexPath, 'utf8');
          const runtime = fs.readFileSync(runtimePath, 'utf8');
          const marker = '/* ---- sources/sources-az.js ---- */';
          const cut = runtime.indexOf(marker);
          if (cut < 0) throw new Error('A-Z runtime marker not found');
          const dom = new JSDOM(html, {url:'https://example.test/sources/', runScripts:'outside-only', pretendToBeVisual:true});
          const window = dom.window;
          window.matchMedia = window.matchMedia || (() => ({matches:false,addEventListener(){},removeEventListener(){}}));
          window.requestAnimationFrame = window.requestAnimationFrame || (cb => setTimeout(cb, 0));
          window.requestIdleCallback = () => 0;
          window.cancelIdleCallback = () => {};
          window.CSS = window.CSS || {};
          window.CSS.escape = window.CSS.escape || (value => String(value));
          window.eval(runtime.slice(0, cut));
          const passes = fs.readdirSync(sourceDir).filter(name => /^sources-pass\d+\.js$/.test(name)).sort((a,b) => Number(a.match(/\d+/)[0]) - Number(b.match(/\d+/)[0]));
          for (const name of passes) {
            const number = Number(name.match(/\d+/)[0]);
            if (number >= 13) window.eval(fs.readFileSync(path.join(sourceDir, name), 'utf8'));
          }
          window.eval(runtime.slice(cut + marker.length));
          setTimeout(() => {
            const doc = window.document;
            const entries = [...doc.querySelectorAll('.source-az-entry')];
            if (!doc.querySelector('.source-az') || entries.length < 20) throw new Error('Static Sources render incomplete: ' + entries.length);
            doc.body.classList.add('sources-az-ready', 'sources-static');
            doc.querySelectorAll('script[src*="sources-runtime.js"],script[src*="unified-ui.js"]').forEach(node => node.remove());
            doc.querySelectorAll('[data-source-pass]').forEach(node => node.removeAttribute('data-source-pass'));
            const filter = doc.createElement('script');
            filter.src = 'sources-filter.js?v=20260810-1';
            filter.defer = true;
            doc.body.appendChild(filter);
            fs.writeFileSync(indexPath, '<!doctype html>\n' + doc.documentElement.outerHTML, 'utf8');
            for (const name of fs.readdirSync(sourceDir)) {
              if (/^sources-pass\d+\.js$/.test(name) || name === 'sources-runtime.js' || name === 'sources-az.js') fs.rmSync(path.join(sourceDir, name), {force:true});
            }
            console.log('Staticized ' + entries.length + ' Sources entries.');
          }, 100);
          NODE
          sleep 1
      - name: Verify static Sources
        run: |
          test -f sources/sources-filter.js
          test ! -f sources/sources-runtime.js
          grep -q 'class="source-az"' sources/index.html
          grep -q 'sources-filter.js?v=20260810-1' sources/index.html
          COUNT=$(grep -o 'source-az-entry' sources/index.html | wc -l)
          echo "Static source entries: $COUNT"
          test "$COUNT" -ge 20
      - name: Commit and remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-staticize-sources.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sources .github/workflows/one-shot-staticize-sources.yml
          git commit -m "Staticize Sources and remove runtime assembly"
          git pull --rebase origin main
          git push origin HEAD:main

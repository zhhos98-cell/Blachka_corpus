name: One-shot performance wiring

on:
  push:
    paths:
      - '.github/workflows/one-shot-performance-wireup.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire consolidated assets and data
        run: python tools/performance_wireup.py
      - name: Commit performance wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire consolidated assets for faster first paint"
          git push
